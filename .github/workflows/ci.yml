name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "EduCore_CI_Passw0rd!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P EduCore_CI_Passw0rd! -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      EDUCORE_TEST_DB_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=EduCore_CI_Passw0rd!;TrustServerCertificate=True"
      JWT_SECRET_KEY: "ci-only-secret-key-that-is-long-enough-0123456789abcdef"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: >
          dotnet test EduCore.IntegrationTests -c Release --no-build
          --logger "trx" --results-directory EduCore.IntegrationTests/TestResults
        env:
          EDUCORE_REQUIRE_DB: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: EduCore.IntegrationTests/TestResults/*.trx
          if-no-files-found: ignore
